<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" role="img" aria-labelledby="t d">
<title id="t">countersign</title>
<desc id="d">Project plate. An agent requests a 1 dollar refund, the merchant's mandate is 25 cents, so countersign blocks it and executes a 25 cent refund exactly once, then re-reads PayPal.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A18"/><stop offset="1" stop-color="#171034"/></linearGradient>
<radialGradient id="glow" cx="0.9" cy="0.2" r="0.6"><stop offset="0" stop-color="#7C3AED" stop-opacity=".30"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F3FF"/><stop offset=".55" stop-color="#C4B5FD"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient></defs>
<rect width="800" height="264" rx="20" fill="url(#bg)"/>
<rect width="800" height="264" rx="20" fill="url(#glow)"/>
<rect x=".5" y=".5" width="799" height="263" rx="19.5" fill="none" stroke="#C4B5FD" stroke-opacity=".16"/>
<text x="40" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#A78BFA" letter-spacing="1">PAYPAL AI HACKATHON 2026 · SANDBOX</text><text x="38" y="112" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" fill="url(#ink)">countersign</text><text x="40" y="150" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#D1D5DB">AI agents can refund only what the merchant authorized.</text><rect x="40" y="186" width="172" height="48" rx="24" fill="none" stroke="#F9A8D4" stroke-opacity=".7"/><text x="126.0" y="217" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#F9A8D4">agent: $1.00</text><line x1="218" y1="210" x2="236" y2="210" stroke="#A78BFA" stroke-width="1.6"/><path d="M235,205 L244,210 L235,215" fill="none" stroke="#A78BFA" stroke-width="1.6"/><rect x="248" y="186" width="196" height="48" rx="24" fill="#67E8F9" fill-opacity=".14" stroke="#67E8F9" stroke-opacity=".7"/><text x="346.0" y="217" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#67E8F9">mandate: $0.25</text><line x1="450" y1="210" x2="468" y2="210" stroke="#A78BFA" stroke-width="1.6"/><path d="M467,205 L476,210 L467,215" fill="none" stroke="#A78BFA" stroke-width="1.6"/><rect x="480" y="186" width="244" height="48" rx="24" fill="none" stroke="#C4B5FD" stroke-opacity=".7"/><text x="602.0" y="217" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#C4B5FD">refund $0.25, once</text>
