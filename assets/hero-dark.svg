<circle cx="80" cy="318" r="11" fill="#0B0F14" stroke="#8B949E" stroke-width="2" stroke-dasharray="3 3"/><text x="68" y="362" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#56606B">01  <tspan fill="#E6EDF3" font-weight="600">PROPOSE</tspan></text><text x="68" y="386" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B949E">The model plans the action</text><rect x="358" y="308" width="20" height="20" fill="#E8A33D"/><text x="356" y="362" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#56606B">02  <tspan fill="#E6EDF3" font-weight="600">ENFORCE</tspan></text><text x="356" y="386" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B949E">Policy in code allows or denies</text><path d="M656 305 L669 318 L656 331 L643 318 Z" fill="#0B0F14" stroke="#E8A33D" stroke-width="2.5"/><text x="644" y="362" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#56606B">03  <tspan fill="#E6EDF3" font-weight="600">AUTHORIZE</tspan></text><text x="644" y="386" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B949E">Above risk limits, a person signs</text><circle cx="944" cy="318" r="12" fill="#3FB950"/><path d="M939 318 l3.5 3.5 l6.5 -7" fill="none" stroke="#0B0F14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="932" y="362" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#56606B">04  <tspan fill="#E6EDF3" font-weight="600">VERIFY</tspan></text><text x="932" y="386" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B949E">Outcome re-checked at the source</text>
