<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Shroddha Ghosh — Software Engineer · AI Systems &amp; Agentic Applications</title><desc id="d">Shroddha Ghosh. Software Engineer · AI Systems &amp; Agentic Applications. Building reliable AI systems that use tools, enforce policies, and verify outcomes. Control loop: the model proposes, code enforces policy, a person authorizes actions above risk limits, the outcome is verified at the source. Flagship systems: PayOps Sentinel, AgentDoor, DisputeDesk.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#18222E"/></pattern><radialGradient id="glow" cx="0.15" cy="0.15" r="0.75"><stop offset="0" stop-color="#F0A832" stop-opacity="0.10"/><stop offset="1" stop-color="#F0A832" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="1199" height="599" rx="18" fill="#0A0E14" stroke="#1E2834"/><rect x="0.5" y="0.5" width="1199" height="599" rx="18" fill="url(#dots)"/><rect x="0.5" y="0.5" width="1199" height="599" rx="18" fill="url(#glow)"/><path d="M24 24 H704 L732 52 V376 H24 Z" fill="#0F151E" stroke="#1E2834"/><rect x="24" y="24" width="4" height="352" fill="#F0A832"/><text x="60" y="68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="500" letter-spacing="2.4" fill="#4FD1E8" text-anchor="start">IDENTITY  /  SHRO-2002</text><text x="56" y="162" font-family="'Avenir Next', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="#E8EDF2" text-anchor="start">Shroddha Ghosh</text><text x="60" y="206" font-family="'Avenir Next', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#F0A832" text-anchor="start">Software Engineer · AI Systems &amp; Agen