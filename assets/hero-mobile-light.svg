<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 788" width="560" height="788" role="img" aria-labelledby="t d"><title id="t">Shroddha Ghosh — Software Engineer · AI Systems &amp; Agentic Applications</title><desc id="d">Shroddha Ghosh. Software Engineer · AI Systems &amp; Agentic Applications. Building reliable AI systems that use tools, enforce policies, and verify outcomes. Control loop: the model proposes, code enforces policy, a person authorizes actions above risk limits, the outcome is verified at the source. Flagship systems: PayOps Sentinel, AgentDoor, DisputeDesk.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#E4DED2"/></pattern><radialGradient id="glow" cx="0.15" cy="0.15" r="0.75"><stop offset="0" stop-color="#B86E00" stop-opacity="0.07"/><stop offset="1" stop-color="#B86E00" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="559" height="787" rx="16" fill="#F5F3EE" stroke="#DCD7CC"/><rect x="0.5" y="0.5" width="559" height="787" rx="16" fill="url(#dots)"/><rect x="0.5" y="0.5" width="559" height="787" rx="16" fill="url(#glow)"/><path d="M16 16 H522 L544 38 V388 H16 Z" fill="#FFFFFF" stroke="#DCD7CC"/><rect x="16" y="16" width="4" height="372" fill="#B86E00"/><text x="44" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="500" letter-spacing="2.4" fill="#0A7D93" text-anchor="start">IDENTITY / SHRO-2002</text><text x="40" y="128" font-family="'Avenir Next', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#0D1117" text-anchor="start">Shroddha Ghosh</text><text x="44" y="170" font-family="'Avenir Next', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="0" fill="#B86E00" text-anchor="start">Software Engineer ·</text><text x="44" y="200"