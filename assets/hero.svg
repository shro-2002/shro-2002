<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Shroddha Ghosh</title>
<desc id="d">Building intelligent systems. Exploring what AI can become. AI Engineering, Agentic Systems, Women in Tech. A small neural lattice sends signals toward one dashed checkpoint; only one verified path continues past it.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A18"/><stop offset="1" stop-color="#171034"/></linearGradient>
<radialGradient id="glowV" cx="0.82" cy="0.35" r="0.45"><stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<radialGradient id="glowP" cx="0.12" cy="1" r="0.5"><stop offset="0" stop-color="#EC4899" stop-opacity=".18"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F3FF"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
<linearGradient id="name2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".6" stop-color="#F0ABFC"/><stop offset="1" stop-color="#F9A8D4"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#F0ABFC"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></linearGradient>
<linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0ABFC"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#C4B5FD" opacity=".08"/></pattern>
</defs>
<style>
.e{stroke:#A78BFA;stroke-opacity:.16;stroke-width:1}
.stop{stroke:#A78BFA;stroke-opacity:.35;stroke-width:1.2}
.tick{stroke:#F9A8D4;stroke-width:2;stroke-linecap:round}
.n{fill:#C4B5FD;animation:tw 4s ease-in-out infinite}
.r{fill:none;stroke:url(#route);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.n,.r{animation:none}}
</style>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#dots)"/>
<rect width="1200" height="420" rx="24" fill="url(#glowV)"/>
<rect width="1200" height="420" rx="24" fill="url(#glowP)"/>
