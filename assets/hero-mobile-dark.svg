<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-labelledby="t d">
<title id="t">Shroddha Ghosh — Software Engineer, AI Systems and Agentic Applications</title>
<desc id="d">Building AI systems that reason, use tools, verify outcomes and stay inside enforceable limits. Four stages: the model proposes, code enforces policy, a person approves actions above risk limits, and the outcome is verified at the source.</desc>
<rect x="0.5" y="0.5" width="559" height="639" rx="14" fill="#0B0F14" stroke="#1E2630"/>
