<text x="32" y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2.4" fill="#8B949E">SOFTWARE ENGINEER</text>
<text x="528" y="52" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2.4" fill="#56606B">GE VERNOVA</text>
<line x1="32" y1="68" x2="528" y2="68" stroke="#E6EDF3" stroke-width="2"/>
<text x="29" y="138" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.8" fill="#E6EDF3">Shroddha Ghosh</text>
<rect x="32" y="158" width="40" height="4" fill="#E8A33D"/>
<text x="32" y="206" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#E6EDF3">Building AI systems that reason,</text><text x="32" y="238" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#E6EDF3">use tools, verify outcomes,</text><text x="32" y="270" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">and stay inside limits that code</text><text x="32" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">can enforce.</text>
<line x1="56" y1="388" x2="56" y2="422" stroke="#8B949E" stroke-width="2" stroke-dasharray="4 5"/><path d="M51 422 L56 430 L61 422 Z" fill="#8B949E"/><line x1="56" y1="460" x2="56" y2="494" stroke="#E8A33D" stroke-width="2"/><path d="M51 494 L56 502 L61 494 Z" fill="#E8A33D"/><line x1="56" y1="532" x2="56" y2="566" stroke="#E8A33D" stroke-width="2"/><path d="M51 566 L56 574 L61 566 Z" fill="#E8A33D"/><circle cx="56" cy="372" r="11" fill="#0B0F14" stroke="#8B949E" stroke-width="2" stroke-dasharray="3 3"/><text x="92" y="370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="2" fill="#56606B">01  <tspan fill="#E6EDF3" font-weight="600">PROPOSE</tspan></text><text x="92" y="397" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8B949E">The model plans the action</text><rect x="46" y="434" width="20" height="20" fill="#E8A33D"/><text x="92" y="442" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="2" fill="#56606B">02  <tspan fill="#E6EDF3" font-weight="600">ENFORCE</tspan></text><text x="92" y="469" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8B949E">Policy in code allows or denies</text><path d="M56 503 L69 516 L56 529 L43 516 Z" fill="#0B0F14" stroke="#E8A33D" stroke-width="2.5"/><text x="92" y="514" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="2" fill="#56606B">03  <tspan fill="#E6EDF3" font-weight="600">AUTHORIZE</tspan></text><text x="92" y="541" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8B949E">Above risk limits, a person signs</text><circle cx="56" cy="588" r="12" fill="#3FB950"/><path d="M51 588 l3.5 3.5 l6.5 -7" fill="none" stroke="#0B0F14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="586" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="2" fill="#56606B">04  <tspan fill="#E6EDF3" font-weight="600">VERIFY</tspan></text><text x="92" y="613" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8B949E">Outcome re-checked at the source</text>
